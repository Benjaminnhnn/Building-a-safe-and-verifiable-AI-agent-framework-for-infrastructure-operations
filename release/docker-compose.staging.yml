services:
  redis:
    image: redis:7-alpine
    container_name: redis-staging
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_BROKER_MAXMEMORY:-512mb}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data-staging:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aiops-network

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache-staging
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_CACHE_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-cache-data-staging:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aiops-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: redis-exporter-staging
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis-cache:6379
    ports:
      - "19121:9121"
    networks:
      - aiops-network
    depends_on:
      redis-cache:
        condition: service_healthy

  redis-broker-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: redis-broker-exporter-staging
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "19122:9121"
    networks:
      - aiops-network
    depends_on:
      redis:
        condition: service_healthy

  ai-agent:
    image: ghcr.io/${GHCR_OWNER:-your-org}/aws-hybrid-ai-agent:${IMAGE_TAG:-staging-latest}
    container_name: ai-agent-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      AI_AGENT_PORT: "8000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      AIOPS_UNIFIED_CORE_MODE: ${AIOPS_UNIFIED_CORE_MODE:-off}
      AIOPS_EVIDENCE_DB_PATH: /app/data/evidence.db
      PYTHONUNBUFFERED: "1"
    ports:
      - "0.0.0.0:18000:8000"
    volumes:
      - runbook-workflow-staging:/app/config/runbook_workflow
      - runbook-published-staging:/app/config/knowledge_base/published
      - aiops-evidence-staging:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - aiops-network
    depends_on:
      redis:
        condition: service_healthy

  celery-worker:
    image: ghcr.io/${GHCR_OWNER:-your-org}/aws-hybrid-ai-agent:${IMAGE_TAG:-staging-latest}
    container_name: celery-worker-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      AIOPS_UNIFIED_CORE_MODE: ${AIOPS_UNIFIED_CORE_MODE:-off}
      AIOPS_EVIDENCE_DB_PATH: /app/data/evidence.db
      PYTHONUNBUFFERED: "1"
    volumes:
      - vector-db-staging:/app/vector_db
      - runbook-workflow-staging:/app/config/runbook_workflow
      - runbook-published-staging:/app/config/knowledge_base/published
      - aiops-evidence-staging:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["celery", "-A", "core.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aiops-network

  log-watcher:
    image: ghcr.io/${GHCR_OWNER:-your-org}/aws-hybrid-ai-agent:${IMAGE_TAG:-staging-latest}
    container_name: log-watcher-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      WEBHOOK_URL: http://ai-agent:8000/webhook
      LOG_FILES: /var/log/syslog,/var/log/cloud-init.log,/var/log/dnf.log,/tmp/test_syslog.log
      PYTHONUNBUFFERED: "1"
    command: ["sh", "-c", "sed -i 's|WEBHOOK_URL = \"http://localhost:8000/webhook\"|WEBHOOK_URL = \"http://ai-agent:8000/webhook\"|' log_watcher.py && python log_watcher.py"]
    volumes:
      - /var/log:/var/log:ro
      - /tmp/aiops-test-syslog.log:/tmp/test_syslog.log:ro
    depends_on:
      ai-agent:
        condition: service_healthy
    networks:
      - aiops-network

  payment-api:
    image: ghcr.io/${GHCR_OWNER:-your-org}/aws-hybrid-payment-api:${IMAGE_TAG:-staging-latest}
    container_name: payment-api-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql://aiops_user:aiops_pass@postgres:5432/aiops_db
    ports:
      - "0.0.0.0:18080:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - aiops-network
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiops_user
      POSTGRES_PASSWORD: aiops_pass
      POSTGRES_DB: aiops_db
    volumes:
      - postgres-data-staging:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops_user -d aiops_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiops-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-staging
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://aiops_user:aiops_pass@postgres:5432/aiops_db?sslmode=disable
    ports:
      - "19187:9187"
    networks:
      - aiops-network
    depends_on:
      postgres:
        condition: service_healthy

  frontend-web:
    image: ghcr.io/${GHCR_OWNER:-your-org}/aws-hybrid-frontend:${IMAGE_TAG:-staging-latest}
    container_name: frontend-web-staging
    restart: unless-stopped
    ports:
      - "80:80"
      - "18081:80"
    environment:
      PAYMENT_API_UPSTREAM: ${PAYMENT_API_UPSTREAM:-http://payment-api:8000}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - aiops-network

networks:
  aiops-network:
    driver: bridge

volumes:
  redis-data-staging:
  redis-cache-data-staging:
  postgres-data-staging:
  vector-db-staging:
  runbook-workflow-staging:
  runbook-published-staging:
  aiops-evidence-staging:
