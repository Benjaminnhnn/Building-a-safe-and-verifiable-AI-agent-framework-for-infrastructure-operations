# ==============================================================================
# SAMPLE COMMUNICATION CONTRACT FOR DEMO-WEB
# ------------------------------------------------------------------------------
# WARNING: THIS IS A SAMPLE CONTRACT FOR DEMO-WEB (FRONTEND, BACKEND, DATABASE)
# CREATED EXCLUSIVELY FOR VERIFIER MECHANISM VALIDATION.
# THIS IS NOT THE PRODUCTION OR STAGING CONTRACT FOR MOODLE.
# ==============================================================================
version: "1.0"
contract_name: "demo-web-communication-contract"
sample_only: true
target_system: "demo-web"
description: "Sample communication contract for demo-web topology to validate multi-tier verification mechanisms."

# Service definitions and required inbound/outbound flows
services:
  frontend:
    description: "Demo-web public web tier"
    health_endpoint: "http://frontend:80/healthz"
    required_flows:
      - "frontend_to_backend"
  backend:
    description: "Demo-web application business logic API tier"
    health_endpoint: "http://backend:8080/health"
    required_flows:
      - "backend_to_database"
  database:
    description: "Demo-web persistent relational database (PostgreSQL)"
    health_endpoint: "database:5432"
    required_flows: []

# Allowed connections: must be operational and responsive
allowed_connections:
  - id: "client_to_frontend"
    name: "client_to_frontend"
    source: "client"
    destination: "frontend"
    port: 80
    protocol: "tcp"
    description: "Public HTTP client traffic to web frontend"

  - id: "frontend_to_backend"
    name: "frontend_to_backend"
    source: "frontend"
    destination: "backend"
    port: 8080
    protocol: "tcp"
    description: "Frontend RPC/REST calls to backend API"

  - id: "backend_to_database"
    name: "backend_to_database"
    source: "backend"
    destination: "database"
    port: 5432
    protocol: "tcp"
    description: "Backend connection pool to PostgreSQL database"

# Forbidden connections: must be blocked / unreachable (security & isolation regression checks)
forbidden_connections:
  - id: "frontend_to_database"
    name: "frontend_to_database"
    source: "frontend"
    destination: "database"
    port: 5432
    protocol: "tcp"
    description: "Direct DB access from frontend is forbidden (tier isolation)"

  - id: "client_to_database"
    name: "client_to_database"
    source: "client"
    destination: "database"
    port: 5432
    protocol: "tcp"
    description: "Direct public client access to database port 5432 is strictly forbidden"

  - id: "database_to_internet"
    name: "database_to_internet"
    source: "database"
    destination: "internet"
    port: 0
    protocol: "all"
    description: "Database outbound egress to public internet is strictly blocked"

