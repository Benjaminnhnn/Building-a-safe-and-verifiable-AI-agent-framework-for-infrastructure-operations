---
# Moodle-only observability. This does not reuse the legacy bank-web/core
# monitoring configuration and does not change the Moodle release stack.
- name: Deploy exporters on Moodle nodes
  hosts: moodle
  become: true
  gather_facts: true

  vars:
    moodle_observability_root: /opt/moodle-observability

  pre_tasks:
    - name: Require Docker on Moodle nodes
      ansible.builtin.command:
        cmd: docker info --format '{{ "{{" }}.ServerVersion{{ "}}" }}'
      changed_when: false

  tasks:
    - name: Create exporter runtime directory
      ansible.builtin.file:
        path: "{{ moodle_observability_root }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create Node Exporter textfile directory
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile_collector
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install EFS mount metric collector
      ansible.builtin.copy:
        dest: /usr/local/sbin/moodle-efs-metric
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/usr/bin/env sh
          set -eu
          output_dir=/var/lib/node_exporter/textfile_collector
          output_file=$output_dir/moodle_efs.prom
          temporary_file=$(mktemp "$output_dir/.moodle_efs.XXXXXX")
          if findmnt --noheadings --target /mnt/efs/moodledata --output FSTYPE \
              | grep -Eq '^(nfs4|efs)$'; then
            value=1
          else
            value=0
          fi
          printf '%s\n' \
            '# HELP moodle_efs_mount_available Whether the Moodle EFS mount is present.' \
            '# TYPE moodle_efs_mount_available gauge' \
            "moodle_efs_mount_available $value" > "$temporary_file"
          chmod 0644 "$temporary_file"
          mv "$temporary_file" "$output_file"

    - name: Install EFS mount metric service
      ansible.builtin.copy:
        dest: /etc/systemd/system/moodle-efs-metric.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Publish Moodle EFS mount metric for Node Exporter
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/moodle-efs-metric

    - name: Install EFS mount metric timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/moodle-efs-metric.timer
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Periodically publish Moodle EFS mount metric

          [Timer]
          OnBootSec=15s
          OnUnitActiveSec=30s
          Unit=moodle-efs-metric.service

          [Install]
          WantedBy=timers.target

    - name: Start EFS mount metric collector
      ansible.builtin.systemd:
        name: moodle-efs-metric.service
        state: started
        daemon_reload: true

    - name: Enable EFS mount metric timer
      ansible.builtin.systemd:
        name: moodle-efs-metric.timer
        enabled: true
        state: started

    - name: Remove legacy synthetic timer from application nodes
      ansible.builtin.shell:
        cmd: |
          systemctl disable --now moodle-synthetic-transaction.timer >/dev/null 2>&1 || true
          systemctl stop moodle-synthetic-transaction.service >/dev/null 2>&1 || true
          rm -f /var/lib/node_exporter/textfile_collector/moodle_synthetic.prom
      changed_when: false

    - name: Install exporter Compose definition
      ansible.builtin.copy:
        dest: "{{ moodle_observability_root }}/docker-compose.yml"
        owner: root
        group: root
        mode: '0644'
        content: |
          services:
            node-exporter:
              image: quay.io/prometheus/node-exporter:v1.8.2
              container_name: moodle-node-exporter
              restart: unless-stopped
              network_mode: host
              pid: host
              command:
                - --path.rootfs=/host
                - --web.listen-address=:9100
                - --collector.textfile.directory=/host/var/lib/node_exporter/textfile_collector
              volumes:
                - /:/host:ro,rslave
              read_only: true
              security_opt:
                - no-new-privileges:true
              cap_drop:
                - ALL

            cadvisor:
              image: gcr.io/cadvisor/cadvisor:v0.49.1
              container_name: moodle-cadvisor
              restart: unless-stopped
              privileged: true
              ports:
                - "8088:8080"
              volumes:
                - /:/rootfs:ro
                - /var/run:/var/run:ro
                - /sys:/sys:ro
                - /var/lib/docker:/var/lib/docker:ro
                - /dev/disk:/dev/disk:ro

    - name: Validate exporter Compose definition
      ansible.builtin.command:
        cmd: docker compose -f {{ moodle_observability_root }}/docker-compose.yml config
      changed_when: false

    - name: Start Moodle exporters
      ansible.builtin.command:
        cmd: docker compose -f {{ moodle_observability_root }}/docker-compose.yml up -d
      changed_when: true

    - name: Wait for Node Exporter
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        status_code: 200
      register: node_exporter_ready
      retries: 12
      delay: 5
      until: node_exporter_ready.status == 200

    - name: Wait for cAdvisor
      ansible.builtin.uri:
        url: http://127.0.0.1:8088/metrics
        status_code: 200
      register: cadvisor_ready
      retries: 12
      delay: 5
      until: cadvisor_ready.status == 200

- name: Deploy the Moodle monitoring control plane
  hosts: monitor
  become: true
  gather_facts: true

  vars:
    moodle_observability_root: /opt/moodle-observability
    moodle_compose_version: v2.29.7
    moodle_compose_sha256: 383ce6698cd5d5bbf958d2c8489ed75094e34a77d340404d9f32c4ae9e12baf0

  pre_tasks:
    - name: Require Terraform-derived Moodle monitoring values
      ansible.builtin.assert:
        that:
          - moodle_monitor_public_url is defined
          - moodle_monitor_public_url is match('^https?://')
          - moodle_monitor_rds_endpoint is defined
          - moodle_monitor_rds_endpoint is match('^[A-Za-z0-9.-]+$')
          - moodle_agent_enabled is defined
          - moodle_synthetic_password_file is defined
        fail_msg: Run the monitoring automation script rather than this playbook directly.

    - name: Require an immutable AI Agent image when the webhook receiver is enabled
      ansible.builtin.assert:
        that:
          - moodle_agent_image is match('^ghcr\\.io/[a-z0-9-]+/moodle-ai-agent:[a-f0-9]{40}$')
        fail_msg: Pass --agent-image with an immutable GHCR commit tag.
      when: moodle_agent_enabled | bool

  tasks:
    - name: Install Docker
      ansible.builtin.dnf:
        name: docker
        state: present
        update_cache: true

    - name: Enable Docker service
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create Docker CLI plugin directory
      ansible.builtin.file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install pinned Docker Compose plugin
      ansible.builtin.get_url:
        url: "https://github.com/docker/compose/releases/download/{{ moodle_compose_version }}/docker-compose-linux-x86_64"
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        owner: root
        group: root
        mode: '0755'
        checksum: "sha256:{{ moodle_compose_sha256 }}"

    - name: Create monitoring configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - "{{ moodle_observability_root }}"
        - "{{ moodle_observability_root }}/prometheus"
        - "{{ moodle_observability_root }}/prometheus/rules"
        - "{{ moodle_observability_root }}/blackbox"
        - "{{ moodle_observability_root }}/alertmanager"
        - "{{ moodle_observability_root }}/grafana"
        - "{{ moodle_observability_root }}/grafana/provisioning"
        - "{{ moodle_observability_root }}/grafana/provisioning/datasources"
        - "{{ moodle_observability_root }}/grafana/provisioning/dashboards"
        - "{{ moodle_observability_root }}/grafana/dashboards"
        - /var/lib/moodle-synthetic
        - /var/lib/moodle-synthetic/continuous

    - name: Install authenticated Moodle synthetic transaction runner
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../automation/moodle-synthetic-transaction.py"
        dest: /usr/local/sbin/moodle-synthetic-transaction
        owner: root
        group: root
        mode: '0755'

    - name: Create root-only Moodle synthetic directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - "{{ moodle_observability_root }}/secrets"
        - /var/lib/moodle-synthetic/continuous

    - name: Allow the monitor textfile exporter to traverse its metric directory
      ansible.builtin.file:
        path: /var/lib/moodle-synthetic
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install root-only Moodle synthetic account password
      ansible.builtin.copy:
        src: "{{ moodle_synthetic_password_file }}"
        dest: "{{ moodle_observability_root }}/secrets/moodle-synthetic-password"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Install Moodle synthetic transaction service
      ansible.builtin.copy:
        dest: /etc/systemd/system/moodle-synthetic-transaction.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Authenticated Moodle synthetic transaction through the ALB
          After=network-online.target docker.service
          Wants=network-online.target

          [Service]
          Type=oneshot
          User=root
          Group=root
          ExecStart=/usr/local/sbin/moodle-synthetic-transaction --once --url {{ moodle_monitor_public_url }} --username admin --password-file {{ moodle_observability_root }}/secrets/moodle-synthetic-password --output-dir /var/lib/moodle-synthetic/continuous --metrics-file /var/lib/moodle-synthetic/moodle_synthetic.prom
          PrivateTmp=true
          NoNewPrivileges=true

    - name: Install Moodle synthetic transaction timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/moodle-synthetic-transaction.timer
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Run the Moodle synthetic transaction every minute

          [Timer]
          OnBootSec=15s
          OnUnitActiveSec=60s
          AccuracySec=1s
          Unit=moodle-synthetic-transaction.service

          [Install]
          WantedBy=timers.target

    - name: Enable Moodle synthetic transaction timer
      ansible.builtin.systemd:
        name: moodle-synthetic-transaction.timer
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode

    - name: Create monitoring secrets directory
      ansible.builtin.file:
        path: "{{ moodle_observability_root }}/secrets"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Create Prometheus data directory
      ansible.builtin.file:
        path: "{{ moodle_observability_root }}/prometheus/data"
        state: directory
        owner: '65534'
        group: '65534'
        mode: '0755'

    - name: Create Alertmanager data directory
      ansible.builtin.file:
        path: "{{ moodle_observability_root }}/alertmanager/data"
        state: directory
        owner: '65534'
        group: '65534'
        mode: '0755'

    - name: Create Grafana data directory
      ansible.builtin.file:
        path: "{{ moodle_observability_root }}/grafana/data"
        state: directory
        owner: '472'
        group: '0'
        mode: '0750'

    - name: Check Grafana administrator password
      ansible.builtin.stat:
        path: "{{ moodle_observability_root }}/secrets/grafana-admin-password"
      register: grafana_admin_password_file

    - name: Generate Grafana administrator password
      ansible.builtin.command:
        cmd: openssl rand -base64 32
      register: generated_grafana_admin_password
      changed_when: true
      no_log: true
      when: not grafana_admin_password_file.stat.exists

    - name: Store Grafana administrator password
      ansible.builtin.copy:
        dest: "{{ moodle_observability_root }}/secrets/grafana-admin-password"
        content: "{{ generated_grafana_admin_password.stdout }}\n"
        owner: root
        group: root
        mode: '0640'
      no_log: true
      when: not grafana_admin_password_file.stat.exists

    - name: Allow the Grafana root group to read its administrator secret
      ansible.builtin.file:
        path: "{{ moodle_observability_root }}/secrets/grafana-admin-password"
        owner: root
        group: root
        mode: '0640'

    - name: Install Prometheus configuration
      ansible.builtin.copy:
        dest: "{{ moodle_observability_root }}/prometheus/prometheus.yml"
        owner: root
        group: root
        mode: '0644'
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s
            external_labels:
              environment: staging
              system: moodle
          alerting:
            alertmanagers:
              - static_configs:
                  - targets: ['alertmanager:9093']
          rule_files:
            - /etc/prometheus/rules/moodle.yml
          scrape_configs:
            - job_name: prometheus
              static_configs:
                - targets: ['prometheus:9090']
            - job_name: moodle_node
              static_configs:
                - targets: ['{{ hostvars["moodle-app-a"].ansible_host }}:9100']
                  labels: {instance: moodle-app-a}
                - targets: ['{{ hostvars["moodle-app-b"].ansible_host }}:9100']
                  labels: {instance: moodle-app-b}
            - job_name: moodle_cadvisor
              static_configs:
                - targets: ['{{ hostvars["moodle-app-a"].ansible_host }}:8088']
                  labels: {instance: moodle-app-a}
                - targets: ['{{ hostvars["moodle-app-b"].ansible_host }}:8088']
                  labels: {instance: moodle-app-b}
            - job_name: moodle_synthetic
              static_configs:
                - targets: ['monitor-node-exporter:9100']
                  labels: {instance: monitor-ai-01}
          {% if moodle_agent_enabled | bool %}
            - job_name: ai_agent
              metrics_path: /metrics
              static_configs:
                - targets: ['ai-agent:8000']
                  labels: {instance: monitor-ai-01, resource_id: ai-agent}
          {% endif %}
            - job_name: blackbox_moodle_public
              metrics_path: /probe
              params: {module: [http_2xx]}
              static_configs:
                - targets: ['{{ moodle_monitor_public_url }}/healthz.php']
                  labels: {service: moodle, probe: healthz}
                - targets: ['{{ moodle_monitor_public_url }}/login/index.php']
                  labels: {service: moodle, probe: login}
              relabel_configs:
                - source_labels: [__address__]
                  target_label: __param_target
                - target_label: __address__
                  replacement: blackbox-exporter:9115
                - source_labels: [__param_target]
                  target_label: target
            - job_name: blackbox_moodle_rds
              metrics_path: /probe
              params: {module: [tcp_connect]}
              static_configs:
                - targets: ['{{ moodle_monitor_rds_endpoint }}:5432']
                  labels: {service: moodle-rds}
              relabel_configs:
                - source_labels: [__address__]
                  target_label: __param_target
                - target_label: __address__
                  replacement: blackbox-exporter:9115
                - source_labels: [__param_target]
                  target_label: target

    - name: Install Moodle alert rules
      ansible.builtin.copy:
        dest: "{{ moodle_observability_root }}/prometheus/rules/moodle.yml"
        owner: root
        group: root
        mode: '0644'
        content: |
          groups:
            - name: moodle-availability
              rules:
                - alert: MoodleNodeExporterDown
                  expr: up{job="moodle_node"} == 0
                  for: 1m
                  labels: {severity: critical, service: moodle, resource_id: moodle-app, runbook: moodle-node-exporter}
                  annotations: {summary: Moodle node metrics unavailable}
                - alert: MoodleCAdvisorDown
                  expr: up{job="moodle_cadvisor"} == 0
                  for: 1m
                  labels: {severity: warning, service: moodle, resource_id: moodle-app, runbook: moodle-cadvisor}
                  annotations: {summary: Moodle container metrics unavailable}
                - alert: MoodlePublicProbeFailed
                  expr: probe_success{job="blackbox_moodle_public"} == 0
                  for: 30s
                  labels: {severity: critical, service: moodle, resource_id: moodle-web-endpoint, runbook: moodle-public-probe}
                  annotations: {summary: "Moodle public {{ "{{" }} $labels.probe {{ "}}" }} probe failed"}
                - alert: MoodleRdsTcpProbeFailed
                  expr: probe_success{job="blackbox_moodle_rds"} == 0
                  for: 1m
                  labels: {severity: critical, service: moodle-rds, resource_id: postgres-db, runbook: moodle-rds-probe}
                  annotations: {summary: Moodle RDS TCP probe failed}
                - alert: MoodleEfsMountMissing
                  expr: moodle_efs_mount_available{job="moodle_node"} == 0 or absent(moodle_efs_mount_available{job="moodle_node"})
                  for: 1m
                  labels: {severity: critical, service: moodle, resource_id: moodledata-volume, runbook: moodle-efs}
                  annotations: {summary: Moodle EFS mount is not observed}
                - alert: MoodleSyntheticTransactionFailed
                  expr: moodle_synthetic_success{job="moodle_synthetic",instance="monitor-ai-01"} == 0
                  # The synthetic runner publishes a completed transaction
                  # result and is scraped every 15s. One pending evaluation is
                  # sufficient for the bounded staging drill and avoids a
                  # 60-second boundary race in DB/NET/SEC detection.
                  for: 15s
                  labels: {severity: critical, service: moodle, resource_id: moodle-app, runbook: moodle-synthetic}
                  annotations: {summary: Authenticated Moodle read/write transaction failed}
                - alert: MoodleSyntheticTransactionStale
                  expr: time() - moodle_synthetic_last_run_timestamp_seconds{job="moodle_synthetic",instance="monitor-ai-01"} > 180
                  for: 1m
                  labels: {severity: warning, service: moodle, resource_id: moodle-app, runbook: moodle-synthetic}
                  annotations: {summary: Moodle synthetic transaction has not run recently}
                - alert: MoodleNodeCpuHigh
                  # The bounded RES-01 CPU injector is a Sprint 2 detection
                  # benchmark. A 30s observation window plus one 15s pending
                  # evaluation gives a <=60s MTTD while still requiring two
                  # fresh node-exporter samples before the alert fires.
                  expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{job="moodle_node",mode="idle"}[30s]))) > 70
                  for: 15s
                  labels: {severity: warning, service: moodle, resource_id: moodle-app, runbook: moodle-cpu}
                  annotations: {summary: Moodle node CPU usage exceeds 70 percent}
                - alert: MoodleWebContainerMissing
                  # CON-01 is intentionally scoped to one non-primary Moodle
                  # node. Two 15s observations (stale threshold + pending
                  # period) keep the live benchmark MTTD within 60 seconds.
                  expr: (time() - max by (instance) (container_last_seen{job="moodle_cadvisor",name="release-moodle-web-1"}) > 15) and on(instance) (up{job="moodle_cadvisor"} == 1)
                  for: 15s
                  labels: {severity: critical, service: moodle, resource_id: moodle-app, runbook: moodle-container}
                  annotations: {summary: Moodle web container is missing from a monitored node}

    - name: Install Blackbox Exporter configuration
      ansible.builtin.copy:
        dest: "{{ moodle_observability_root }}/blackbox/blackbox.yml"
        owner: root
        group: root
        mode: '0644'
        content: |
          modules:
            http_2xx:
              prober: http
              timeout: 10s
              http:
                method: GET
                preferred_ip_protocol: ip4
                valid_status_codes: [200]
            tcp_connect:
              prober: tcp
              timeout: 10s

    - name: Install Alertmanager baseline configuration
      ansible.builtin.copy:
        dest: "{{ moodle_observability_root }}/alertmanager/alertmanager.yml"
        owner: root
        group: root
        mode: '0644'
        content: |
          global:
            resolve_timeout: 5m
          route:
            receiver: {{ 'ai-agent' if (moodle_agent_enabled | bool) else 'baseline' }}
            group_by: [alertname, instance, service]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
          receivers:
          {% if moodle_agent_enabled | bool %}
            - name: ai-agent
              webhook_configs:
                - url: http://ai-agent:8000/webhook
                  send_resolved: true
                  max_alerts: 20
          {% else %}
            - name: baseline
          {% endif %}

    - name: Provision Grafana Prometheus datasource
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/moodle-monitoring/grafana/prometheus-datasource.yml"
        dest: "{{ moodle_observability_root }}/grafana/provisioning/datasources/prometheus.yml"
        owner: root
        group: root
        mode: '0644'

    - name: Provision Grafana dashboard provider
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/moodle-monitoring/grafana/dashboard-provider.yml"
        dest: "{{ moodle_observability_root }}/grafana/provisioning/dashboards/moodle.yml"
        owner: root
        group: root
        mode: '0644'

    - name: Install Moodle infrastructure dashboard
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/moodle-monitoring/grafana/moodle-infrastructure.json"
        dest: "{{ moodle_observability_root }}/grafana/dashboards/moodle-infrastructure.json"
        owner: root
        group: root
        mode: '0644'

    - name: Install monitoring Compose definition
      ansible.builtin.copy:
        dest: "{{ moodle_observability_root }}/docker-compose.yml"
        owner: root
        group: root
        mode: '0644'
        content: |
          services:
          {% if moodle_agent_enabled | bool %}
            agent-redis:
              image: redis:7-alpine
              container_name: moodle-agent-redis
              restart: unless-stopped
              command: [redis-server, --appendonly, "yes", --maxmemory, 256mb, --maxmemory-policy, noeviction]
              volumes:
                - agent-redis-data:/data
              healthcheck:
                test: [CMD, redis-cli, ping]
                interval: 10s
                timeout: 3s
                retries: 6
            ai-agent:
              image: {{ moodle_agent_image }}
              container_name: moodle-ai-agent
              restart: unless-stopped
              environment:
                AI_AGENT_PORT: "8000"
                REDIS_HOST: agent-redis
                REDIS_PORT: "6379"
                REDIS_DB: "0"
                PROMETHEUS_URL: http://prometheus:9090
                VECTOR_DB_PATH: /app/vector_db
                AIOPS_UNIFIED_CORE_MODE: shadow
                AIOPS_EVIDENCE_DB_PATH: /app/data/evidence.db
                GEMINI_MAX_ATTEMPTS: "1"
                GEMINI_MAX_REMOTE_CALLS: "1"
                PYTHONUNBUFFERED: "1"
              ports: ["127.0.0.1:8000:8000"]
              volumes:
                - agent-vector-db:/app/vector_db
                - agent-evidence:/app/data
              healthcheck:
                test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
                interval: 15s
                timeout: 5s
                retries: 12
                start_period: 30s
              depends_on:
                agent-redis:
                  condition: service_healthy
            celery-worker:
              image: {{ moodle_agent_image }}
              container_name: moodle-agent-worker
              restart: unless-stopped
              environment:
                REDIS_HOST: agent-redis
                REDIS_PORT: "6379"
                REDIS_DB: "0"
                PROMETHEUS_URL: http://prometheus:9090
                VECTOR_DB_PATH: /app/vector_db
                AIOPS_UNIFIED_CORE_MODE: shadow
                AIOPS_EVIDENCE_DB_PATH: /app/data/evidence.db
                GEMINI_MAX_ATTEMPTS: "1"
                GEMINI_MAX_REMOTE_CALLS: "1"
                PYTHONUNBUFFERED: "1"
              command: [celery, -A, core.celery_app.celery_app, worker, --loglevel=INFO, --concurrency=1]
              volumes:
                - agent-vector-db:/app/vector_db
                - agent-evidence:/app/data
              depends_on:
                agent-redis:
                  condition: service_healthy
          {% endif %}
            monitor-node-exporter:
              image: quay.io/prometheus/node-exporter:v1.8.2
              container_name: moodle-monitor-node-exporter
              restart: unless-stopped
              command:
                - --web.listen-address=:9100
                - --collector.disable-defaults
                - --collector.textfile
                - --collector.textfile.directory=/textfiles
              volumes:
                - /var/lib/moodle-synthetic:/textfiles:ro
              read_only: true
              security_opt:
                - no-new-privileges:true
              cap_drop:
                - ALL
            prometheus:
              image: prom/prometheus:v2.53.3
              container_name: moodle-prometheus
              restart: unless-stopped
              ports: ["127.0.0.1:9090:9090"]
              volumes:
                - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
                - ./prometheus/rules:/etc/prometheus/rules:ro
                - ./prometheus/data:/prometheus
              command:
                - --config.file=/etc/prometheus/prometheus.yml
                - --storage.tsdb.path=/prometheus
                - --storage.tsdb.retention.time=15d
            blackbox-exporter:
              image: prom/blackbox-exporter:v0.25.0
              container_name: moodle-blackbox-exporter
              restart: unless-stopped
              ports: ["127.0.0.1:9115:9115"]
              volumes:
                - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
              command: [--config.file=/etc/blackbox_exporter/config.yml]
            alertmanager:
              image: prom/alertmanager:v0.27.0
              container_name: moodle-alertmanager
              restart: unless-stopped
              ports: ["127.0.0.1:9093:9093"]
              volumes:
                - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
                - ./alertmanager/data:/alertmanager
              command:
                - --config.file=/etc/alertmanager/alertmanager.yml
                - --storage.path=/alertmanager
          {% if moodle_agent_enabled | bool %}
              depends_on:
                ai-agent:
                  condition: service_healthy
          {% endif %}
            grafana:
              image: grafana/grafana:13.2.0
              container_name: moodle-grafana
              restart: unless-stopped
              ports: ["127.0.0.1:3000:3000"]
              environment:
                GF_SECURITY_ADMIN_USER: admin
                GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
                GF_USERS_ALLOW_SIGN_UP: "false"
                GF_AUTH_ANONYMOUS_ENABLED: "false"
                GF_ANALYTICS_REPORTING_ENABLED: "false"
                GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
              secrets:
                - grafana_admin_password
              volumes:
                - ./grafana/data:/var/lib/grafana
                - ./grafana/provisioning:/etc/grafana/provisioning:ro
                - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
              depends_on:
                - prometheus
          secrets:
            grafana_admin_password:
              file: ./secrets/grafana-admin-password
          {% if moodle_agent_enabled | bool %}
          volumes:
            agent-redis-data:
            agent-vector-db:
            agent-evidence:
          {% endif %}

    - name: Pull the immutable AI Agent image
      ansible.builtin.command:
        cmd: docker pull {{ moodle_agent_image }}
      changed_when: true
      when: moodle_agent_enabled | bool

    - name: Validate monitoring Compose definition
      ansible.builtin.command:
        cmd: docker compose -f {{ moodle_observability_root }}/docker-compose.yml config
      changed_when: false

    - name: Start Moodle monitoring stack
      ansible.builtin.command:
        cmd: docker compose -f {{ moodle_observability_root }}/docker-compose.yml up -d
      changed_when: true

    - name: Recreate metric and alert services after bind-mounted configuration changes
      ansible.builtin.command:
        cmd: docker compose -f {{ moodle_observability_root }}/docker-compose.yml up -d --force-recreate monitor-node-exporter prometheus alertmanager
      changed_when: true

    - name: Restart Grafana to apply provisioned configuration
      ansible.builtin.command:
        cmd: docker compose -f {{ moodle_observability_root }}/docker-compose.yml up -d --force-recreate grafana
      changed_when: true

    - name: Wait for Prometheus readiness
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/-/ready
        status_code: 200
      register: prometheus_ready
      retries: 18
      delay: 5
      until: prometheus_ready.status == 200

    - name: Wait for Alertmanager readiness
      ansible.builtin.uri:
        url: http://127.0.0.1:9093/-/ready
        status_code: 200
      register: alertmanager_ready
      retries: 18
      delay: 5
      until: alertmanager_ready.status == 200

    - name: Wait for AI Agent readiness
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/health
        status_code: 200
      register: agent_ready
      retries: 24
      delay: 5
      until: agent_ready.status == 200
      when: moodle_agent_enabled | bool

    - name: Wait for Grafana readiness
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/health
        status_code: 200
      register: grafana_ready
      retries: 18
      delay: 5
      until: grafana_ready.status == 200

    - name: Read Grafana administrator password for provisioning checks
      ansible.builtin.slurp:
        src: "{{ moodle_observability_root }}/secrets/grafana-admin-password"
      register: grafana_admin_password_secret
      no_log: true

    - name: Synchronize the Grafana administrator password
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -i
          - moodle-grafana
          - grafana
          - cli
          - admin
          - reset-admin-password
          - --password-from-stdin
        stdin: "{{ grafana_admin_password_secret.content | b64decode | trim }}"
      changed_when: true
      no_log: true

    - name: Verify provisioned Prometheus datasource
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/datasources/uid/prometheus
        user: admin
        password: "{{ grafana_admin_password_secret.content | b64decode | trim }}"
        force_basic_auth: true
        status_code: 200
      no_log: true

    - name: Verify provisioned Moodle dashboard
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/dashboards/uid/moodle-infrastructure
        user: admin
        password: "{{ grafana_admin_password_secret.content | b64decode | trim }}"
        force_basic_auth: true
        status_code: 200
      no_log: true

    - name: Verify Prometheus configuration
      ansible.builtin.command:
        cmd: docker exec moodle-prometheus promtool check config /etc/prometheus/prometheus.yml
      changed_when: false

    - name: Verify Alertmanager configuration
      ansible.builtin.command:
        cmd: docker exec moodle-alertmanager amtool check-config /etc/alertmanager/alertmanager.yml
      changed_when: false
