---
# Monitoring and Host Configuration Playbook
# Deploys: Node Exporter, Prometheus, Blackbox Exporter, AlertManager,
# Grafana, dashboards, and host firewall rules
# Usage: ansible-playbook -i inventory.ini playbooks/configure-monitoring-stack.yml
#
# This playbook imports bootstrap.yml first to install system dependencies and Docker

# ========== PHASE 0: Bootstrap (imported from bootstrap.yml) ==========
- import_playbook: bootstrap.yml

- name: "====== COMPLETE INFRASTRUCTURE DEPLOYMENT ======"
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Display deployment plan
      debug:
        msg:
          - "=============================================="
          - "AWS Hybrid Monitoring & Host Configuration"
          - "=============================================="
          - "Monitors: Prometheus, Grafana, AlertManager"
          - "Monitor Server: monitor-ai-01"
          - "Node Exporter Targets: all inventory hosts"
          - "=============================================="

# ========== PHASE 1: Deploy Node Exporter (Monitoring) ==========
- name: "PHASE 1: Deploy Node Exporter on All Servers"
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    - name: Download and install node_exporter
      shell: |
        cd /tmp
        wget -q https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz
        tar xzf node_exporter-1.7.0.linux-amd64.tar.gz
        cp node_exporter-1.7.0.linux-amd64/node_exporter /usr/local/bin/
        chmod +x /usr/local/bin/node_exporter
        rm -rf node_exporter-1.7.0.linux-amd64*
      args:
        creates: /usr/local/bin/node_exporter

    - name: Create node_exporter systemd service
      copy:
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          Type=simple
          User=nobody
          ExecStart=/usr/local/bin/node_exporter --collector.processes
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/node_exporter.service
        mode: '0644'

    - name: Enable and start node_exporter service
      systemd:
        name: node_exporter
        enabled: yes
        state: restarted
        daemon_reload: yes

    - name: Wait for node_exporter to be ready
      wait_for:
        port: 9100
        delay: 2
        timeout: 30

    - name: Verify node_exporter metrics
      shell: curl -s http://localhost:9100/metrics | head -3
      register: node_exporter_metrics
      changed_when: false

    - name: Run cAdvisor for Docker container metrics
      shell: |
        docker rm -f cadvisor >/dev/null 2>&1 || true
        docker run -d \
          --name cadvisor \
          --restart unless-stopped \
          --privileged \
          -p 8088:8080 \
          -v /:/rootfs:ro \
          -v /var/run:/var/run:ro \
          -v /sys:/sys:ro \
          -v /var/lib/docker/:/var/lib/docker:ro \
          -v /dev/disk/:/dev/disk:ro \
          gcr.io/cadvisor/cadvisor:v0.49.1
      register: cadvisor_start
      changed_when: "'cadvisor' in cadvisor_start.stdout"

    - name: Wait for cAdvisor to be ready
      wait_for:
        port: 8088
        delay: 2
        timeout: 30

# ========== PHASE 2: Deploy Prometheus & AlertManager (Monitor Server) ==========
- name: "PHASE 2: Deploy Prometheus & AlertManager"
  hosts: monitor
  become: yes
  gather_facts: yes

  tasks:
    - name: Create Prometheus data directories
      file:
        path: "{{ item }}"
        state: directory
        owner: nobody
        group: nobody
        mode: '0755'
      loop:
        - /opt/prometheus
        - /opt/prometheus/data
        - /opt/blackbox
        - /opt/alertmanager
        - /opt/alertmanager/data

    - name: Copy Prometheus configuration
      copy:
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s
            external_labels:
              monitor: 'aiops-monitor'

          alerting:
            alertmanagers:
              - static_configs:
                  - targets: ['localhost:9093']

          rule_files:
            - "/etc/prometheus/alert_rules.yml"

          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']

            - job_name: 'node_exporter_monitor'
              static_configs:
                - targets: ['localhost:9100']
                  labels:
                    instance: 'monitor-ai-01'
                    service: 'system'
              scrape_interval: 15s
              scrape_timeout: 10s

            - job_name: 'node_exporter_web'
              static_configs:
                - targets: ['{{ hostvars[groups["web"][0]].ansible_default_ipv4.address }}:9100']
                  labels:
                    instance: 'bank-web-01'
                    service: 'system'
              scrape_interval: 15s
              scrape_timeout: 10s

            - job_name: 'node_exporter_core'
              static_configs:
                - targets: ['{{ hostvars[groups["core"][0]].ansible_default_ipv4.address }}:9100']
                  labels:
                    instance: 'bank-core-01'
                    service: 'system'
              scrape_interval: 15s
              scrape_timeout: 10s

            - job_name: 'redis_exporter_monitor_staging'
              static_configs:
                - targets: ['localhost:19121']
                  labels:
                    instance: 'monitor-ai-01'
                    service: 'redis'
                    component: 'redis-cache-staging'
                    environment: 'staging'
                    runbook: 'redis'
              scrape_interval: 15s
              scrape_timeout: 10s

            - job_name: 'redis_broker_exporter_monitor_staging'
              static_configs:
                - targets: ['localhost:19122']
                  labels:
                    instance: 'monitor-ai-01'
                    service: 'redis-broker'
                    component: 'redis-staging'
                    environment: 'staging'
                    runbook: 'redis'
              scrape_interval: 15s
              scrape_timeout: 10s

            - job_name: 'ai_agent_monitor_staging'
              static_configs:
                - targets: ['localhost:18000']
                  labels:
                    instance: 'monitor-ai-01'
                    service: 'ai-agent'
                    environment: 'staging'
              scrape_interval: 15s
              scrape_timeout: 10s

            - job_name: 'postgres_exporter_core_staging'
              static_configs:
                - targets: ['{{ hostvars[groups["core"][0]].ansible_default_ipv4.address }}:19187']
                  labels:
                    instance: 'bank-core-01'
                    service: 'postgresql'
                    component: 'postgres-staging'
                    environment: 'staging'
                    runbook: 'postgresql'
              scrape_interval: 15s
              scrape_timeout: 10s

            - job_name: 'cadvisor_monitor'
              static_configs:
                - targets: ['localhost:8088']
                  labels:
                    instance: 'monitor-ai-01'
                    service: 'docker'
                    runbook: 'docker'
              scrape_interval: 15s
              scrape_timeout: 10s

            - job_name: 'cadvisor_web'
              static_configs:
                - targets: ['{{ hostvars[groups["web"][0]].ansible_default_ipv4.address }}:8088']
                  labels:
                    instance: 'bank-web-01'
                    service: 'docker'
                    runbook: 'docker'
              scrape_interval: 15s
              scrape_timeout: 10s

            - job_name: 'cadvisor_core'
              static_configs:
                - targets: ['{{ hostvars[groups["core"][0]].ansible_default_ipv4.address }}:8088']
                  labels:
                    instance: 'bank-core-01'
                    service: 'docker'
                    runbook: 'docker'
              scrape_interval: 15s
              scrape_timeout: 10s

            - job_name: 'blackbox_http_web_staging'
              metrics_path: /probe
              params:
                module: [http_2xx]
              static_configs:
                - targets: ['http://{{ hostvars[groups["web"][0]].ansible_host }}:18081/health']
                  labels:
                    instance: 'bank-web-01'
                    service: 'nginx'
                    component: 'frontend-web-staging'
                    environment: 'staging'
                    runbook: 'nginx'
                    endpoint: '/health'
              relabel_configs:
                - source_labels: [__address__]
                  target_label: __param_target
                - target_label: __address__
                  replacement: localhost:9115
                - source_labels: [__param_target]
                  target_label: target

            - job_name: 'blackbox_http_web_api_staging'
              metrics_path: /probe
              params:
                module: [http_2xx]
              static_configs:
                - targets: ['http://{{ hostvars[groups["web"][0]].ansible_host }}:18081/api/ready']
                  labels:
                    instance: 'bank-web-01'
                    service: 'api-proxy'
                    component: 'frontend-web-staging'
                    dependency: 'payment-api-staging'
                    dependency_instance: 'bank-core-01'
                    expected_upstream: 'http://{{ hostvars[groups["core"][0]].ansible_default_ipv4.address }}:18080'
                    environment: 'staging'
                    runbook: 'api-proxy'
                    endpoint: '/api/ready'
              relabel_configs:
                - source_labels: [__address__]
                  target_label: __param_target
                - target_label: __address__
                  replacement: localhost:9115
                - source_labels: [__param_target]
                  target_label: target

            - job_name: 'blackbox_http_payment_api_staging'
              metrics_path: /probe
              params:
                module: [http_2xx]
              static_configs:
                - targets: ['http://{{ hostvars[groups["core"][0]].ansible_default_ipv4.address }}:18080/api/ready']
                  labels:
                    instance: 'bank-core-01'
                    service: 'payment-api'
                    component: 'payment-api-staging'
                    environment: 'staging'
                    runbook: 'payment-api'
                    endpoint: '/api/ready'
              relabel_configs:
                - source_labels: [__address__]
                  target_label: __param_target
                - target_label: __address__
                  replacement: localhost:9115
                - source_labels: [__param_target]
                  target_label: target
        dest: /opt/prometheus/prometheus.yml
        owner: nobody
        group: nobody
        mode: '0644'

    - name: Check alert rules path
      stat:
        path: /opt/prometheus/alert_rules.yml
      register: prometheus_alert_rules

    - name: Remove stale alert rules directory
      file:
        path: /opt/prometheus/alert_rules.yml
        state: absent
      when: prometheus_alert_rules.stat.isdir | default(false)

    - name: Copy Prometheus alert rules
      copy:
        src: "{{ playbook_dir }}/../config/alert_rules.yml"
        dest: /opt/prometheus/alert_rules.yml
        owner: nobody
        group: nobody
        mode: '0644'

    - name: Deploy AlertManager configuration from template
      template:
        src: "{{ playbook_dir }}/../config/alertmanager.yml.j2"
        dest: /opt/alertmanager/alertmanager.yml
        owner: nobody
        group: nobody
        mode: '0644'

    - name: Create Blackbox Exporter configuration
      copy:
        content: |
          modules:
            http_2xx:
              prober: http
              timeout: 5s
              http:
                method: GET
                preferred_ip_protocol: ip4
                valid_status_codes: []
                follow_redirects: true
        dest: /opt/blackbox/blackbox.yml
        owner: nobody
        group: nobody
        mode: '0644'

    - name: Create Prometheus docker-compose.yml
      copy:
        content: |
          version: '3.8'
          services:
            prometheus:
              image: prom/prometheus:latest
              container_name: prometheus
              network_mode: host
              volumes:
                - /opt/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
                - /opt/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
                - /opt/prometheus/data:/prometheus
              command:
                - '--config.file=/etc/prometheus/prometheus.yml'
                - '--storage.tsdb.path=/prometheus'
                - '--storage.tsdb.retention.time=30d'
              restart: unless-stopped
              depends_on:
                - blackbox-exporter

            blackbox-exporter:
              image: prom/blackbox-exporter:latest
              container_name: blackbox-exporter
              network_mode: host
              volumes:
                - /opt/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
              command:
                - '--config.file=/etc/blackbox_exporter/config.yml'
              restart: unless-stopped

            alertmanager:
              image: prom/alertmanager:latest
              container_name: alertmanager
              network_mode: host
              volumes:
                - /opt/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
                - /opt/alertmanager/data:/alertmanager
              command:
                - '--config.file=/etc/alertmanager/alertmanager.yml'
                - '--storage.path=/alertmanager'
              restart: unless-stopped

          networks:
            aiops-network:
              driver: bridge
        dest: /opt/prometheus/docker-compose.yml
        mode: '0644'

    - name: Start Prometheus and AlertManager
      shell: |
        cd /opt/prometheus
        docker-compose up -d --force-recreate
      register: prometheus_start
      changed_when: "'Started' in prometheus_start.stderr or 'Creating' in prometheus_start.stderr"

    - name: Wait for Prometheus to be ready
      wait_for:
        port: 9090
        delay: 5
        timeout: 30

    - name: Wait for AlertManager to be ready
      wait_for:
        port: 9093
        delay: 5
        timeout: 30

    - name: Verify Prometheus is responding
      shell: curl -s http://localhost:9090/-/healthy
      register: prometheus_health
      changed_when: false

# ========== PHASE 3: Deploy Grafana (Monitor Server) ==========
- name: "PHASE 3: Deploy Grafana"
  hosts: monitor
  become: yes
  gather_facts: yes

  tasks:
    - name: Create Grafana data directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "472"
        group: "472"
        mode: '0755'
      loop:
        - /opt/grafana
        - /opt/grafana/data
        - /opt/grafana/provisioning
        - /opt/grafana/provisioning/datasources
        - /opt/grafana/provisioning/dashboards

    - name: Create Grafana datasource configuration
      copy:
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              uid: prometheus
              type: prometheus
              access: proxy
              url: http://{{ ansible_default_ipv4.address }}:9090
              isDefault: true
              editable: true
        dest: /opt/grafana/provisioning/datasources/prometheus.yml
        mode: '0644'

    - name: Create Grafana docker-compose.yml
      copy:
        content: |
          version: '3.8'
          services:
            grafana:
              image: grafana/grafana:latest
              container_name: grafana
              ports:
                - "3000:3000"
              environment:
                - GF_SECURITY_ADMIN_USER=admin
                - GF_SECURITY_ADMIN_PASSWORD=admin123
                - GF_INSTALL_PLUGINS=grafana-piechart-panel
              volumes:
                - /opt/grafana/data:/var/lib/grafana
                - /opt/grafana/provisioning:/etc/grafana/provisioning
              networks:
                - aiops-network
              restart: unless-stopped

          networks:
            aiops-network:
              driver: bridge
        dest: /opt/grafana/docker-compose.yml
        mode: '0644'

    - name: Start Grafana
      shell: |
        cd /opt/grafana
        docker-compose up -d
      register: grafana_start
      changed_when: "'Started' in grafana_start.stderr or 'Creating' in grafana_start.stderr"

    - name: Wait for Grafana to be ready
      wait_for:
        port: 3000
        delay: 5
        timeout: 30

    - name: Verify Grafana is responding
      shell: curl -s http://localhost:3000/api/health
      register: grafana_health
      changed_when: false
      retries: 3
      delay: 2

    - name: Wait for Prometheus to be ready for dashboard creation
      uri:
        url: "http://localhost:9090/-/healthy"
        method: GET
        status_code: 200
      retries: 30
      delay: 1
      register: prometheus_ready
      until: prometheus_ready.status == 200
      ignore_errors: yes

    - name: Create Prometheus datasource via API
      uri:
        url: "http://localhost:3000/api/datasources"
        method: POST
        user: "admin"
        password: "admin123"
        force_basic_auth: yes
        body_format: json
        body: |
          {
            "name": "Prometheus",
            "uid": "prometheus",
            "type": "prometheus",
            "access": "proxy",
            "url": "http://localhost:9090",
            "isDefault": true,
            "jsonData": {
              "timeInterval": "15s"
            }
          }
        status_code: [200, 409]
      register: datasource_result

    - name: Delete all existing dashboards
      shell: |
        curl -s "http://admin:admin123@localhost:3000/api/search?type=dash-db" | \
        python3 -c "import sys, json; data=json.load(sys.stdin); [print(d['uid']) for d in data]" | \
        while read uid; do
          curl -s -X DELETE "http://admin:admin123@localhost:3000/api/dashboards/uid/$uid"
          echo "Deleted dashboard: $uid"
        done
      ignore_errors: yes

    - name: Copy dashboard JSON templates to monitor server
      copy:
        src: templates/{{ item }}-dashboard.json
        dest: /tmp/{{ item }}-dashboard.json
      with_items:
        - system-overview
        - alert-monitoring
        - network-performance
      ignore_errors: yes

    - name: Align dashboard datasource UID with Grafana Prometheus datasource
      shell: |
        prometheus_uid="$(curl -s "http://admin:admin123@localhost:3000/api/datasources/name/Prometheus" | python3 -c "import sys, json; print(json.load(sys.stdin)['uid'])")"
        python3 - "$prometheus_uid" /tmp/system-overview-dashboard.json /tmp/alert-monitoring-dashboard.json /tmp/network-performance-dashboard.json <<'PY'
        import json
        import sys

        prometheus_uid = sys.argv[1]
        for path in sys.argv[2:]:
            with open(path, "r", encoding="utf-8") as f:
                payload = json.load(f)
            dashboard = payload.get("dashboard", payload)
            for panel in dashboard.get("panels", []):
                for target in panel.get("targets", []):
                    datasource = target.get("datasource")
                    if isinstance(datasource, dict) and datasource.get("type") == "prometheus":
                        datasource["uid"] = prometheus_uid
            with open(path, "w", encoding="utf-8") as f:
                json.dump(payload, f)
        PY
      changed_when: false

    - name: Deploy 3 Grafana Dashboards from template files
      shell: |
        for dashboard in system-overview alert-monitoring network-performance; do
          curl -s -X POST "http://admin:admin123@localhost:3000/api/dashboards/db" \
            -H "Content-Type: application/json" \
            -d @/tmp/${dashboard}-dashboard.json
          echo "✓ Deployed ${dashboard} dashboard"
        done
      ignore_errors: yes

    - name: Display Grafana Setup Complete
      debug:
        msg:
          - "=========================================="
          - "✅ Grafana Dashboards Setup Complete"
          - "=========================================="
          - ""
          - "DASHBOARDS CREATED:"
          - "  ✓ System Overview - Real-time Monitoring"
          - "    - CPU Usage (gauge + timeseries)"
          - "    - Memory Usage (gauge + timeseries)"
          - "    - Disk Usage (gauge + timeseries)"
          - "    - Network Traffic monitoring"
          - ""
          - "  ✓ Alert Monitoring"
          - "    - Warning Alerts counter"
          - "    - Critical Alerts counter"
          - "    - Service Status table"
          - "    - Active Alerts timeline"
          - ""
          - "  ✓ Network & Performance"
          - "    - Network Traffic (RX/TX)"
          - "    - System Load Average"
          - "    - Disk I/O Operations"
          - "    - Network Interface Status"
          - ""
          - "DATASOURCE CONFIGURED:"
          - "  ✓ Prometheus connected"
          - "    - Refresh interval: 15s"
          - "    - Set as default datasource"
          - ""
          - "ACCESS GRAFANA:"
          - "  URL: http://{{ ansible_default_ipv4.address }}:3000"
          - "  User: admin"
          - "  Password: admin123"
          - "=========================================="

# ========== PHASE 4: Firewall Configuration ==========
- name: "PHASE 4: Configure Firewall Rules"
  hosts: all
  become: yes

  tasks:
    - name: Configure firewall for monitor server
      shell: |
        if ! command -v firewall-cmd >/dev/null 2>&1; then
          echo "firewall-cmd not installed; skipping"
          exit 0
        fi
        systemctl is-active --quiet firewalld || systemctl start firewalld
        if firewall-cmd --permanent --query-port={{ item }}/tcp >/dev/null 2>&1; then
          echo "port {{ item }}/tcp already enabled"
        else
          firewall-cmd --permanent --add-port={{ item }}/tcp
          echo "enabled {{ item }}/tcp"
        fi
      changed_when: "'enabled ' in firewall_monitor.stdout"
      register: firewall_monitor
      loop:
        - 9090  # Prometheus
        - 9093  # AlertManager
        - 3000  # Grafana
        - 8000  # AI Agent
        - 18000 # AI Agent staging
        - 9100  # Node Exporter
        - 9121  # Redis Exporter
        - 19121 # Redis Exporter staging
        - 9122  # Redis Broker Exporter
        - 19122 # Redis Broker Exporter staging
        - 8088  # cAdvisor
      when: inventory_hostname == 'monitor-ai-01'

    - name: Configure firewall for web server
      shell: |
        if ! command -v firewall-cmd >/dev/null 2>&1; then
          echo "firewall-cmd not installed; skipping"
          exit 0
        fi
        systemctl is-active --quiet firewalld || systemctl start firewalld
        if firewall-cmd --permanent --query-port={{ item }}/tcp >/dev/null 2>&1; then
          echo "port {{ item }}/tcp already enabled"
        else
          firewall-cmd --permanent --add-port={{ item }}/tcp
          echo "enabled {{ item }}/tcp"
        fi
      changed_when: "'enabled ' in firewall_web.stdout"
      register: firewall_web
      loop:
        - 80    # HTTP
        - 443   # HTTPS
        - 18081 # Frontend staging
        - 9100  # Node Exporter
        - 8088  # cAdvisor
      when: "'web' in group_names"

    - name: Configure firewall for core server
      shell: |
        if ! command -v firewall-cmd >/dev/null 2>&1; then
          echo "firewall-cmd not installed; skipping"
          exit 0
        fi
        systemctl is-active --quiet firewalld || systemctl start firewalld
        changed=0
        for port in 18080 9100 9187 19187 8088; do
          if firewall-cmd --permanent --query-port=${port}/tcp >/dev/null 2>&1; then
            echo "port ${port}/tcp already enabled"
          else
            firewall-cmd --permanent --add-port=${port}/tcp
            echo "enabled ${port}/tcp"
            changed=1
          fi
        done
        exit 0
      changed_when: "'enabled ' in firewall_core.stdout"
      register: firewall_core
      when: "'core' in group_names"

    - name: Reload firewall
      shell: |
        if command -v firewall-cmd >/dev/null 2>&1 && systemctl is-active --quiet firewalld; then
          firewall-cmd --reload
        else
          echo "firewalld not active; skipping reload"
        fi
      changed_when: false

# ========== PHASE 5: Summary and Verification ==========
- name: "PHASE 5: Summary and Health Check"
  hosts: localhost
  gather_facts: no

  tasks:
    - name: Display deployment summary
      debug:
        msg:
          - ""
          - "=================================================="
          - "DEPLOYMENT COMPLETED SUCCESSFULLY!"
          - "=================================================="
          - ""
          - "SERVICES DEPLOYED:"
          - "  ✓ Prometheus (Monitor: 9090)"
          - "  ✓ AlertManager (Monitor: 9093)"
          - "  ✓ Grafana (Monitor: 3000)"
          - "  ✓ Node Exporter (All: 9100)"
          - "  ✓ Host firewall rules for monitoring paths"
          - "  ✓ Application release stack is handled separately by CI/CD"
          - ""
          - "DEFAULT CREDENTIALS:"
          - "  Grafana: admin / admin123"
          - "  Prometheus: No auth required"
          - "  AlertManager: No auth required"
          - ""
          - "ACCESS URLS:"
          - "  Grafana: http://<monitor-ip>:3000"
          - "  Prometheus: http://<monitor-ip>:9090"
          - "  AlertManager: http://<monitor-ip>:9093"
          - "  Release runtime: automation/app-release-deploy.sh via CI/CD"
          - ""
          - "NEXT STEPS:"
          - "  1. Change Grafana admin password"
          - "  2. Verify Prometheus targets and Grafana dashboards"
          - "  3. Configure release runtime on the monitor host"
          - "  4. Trigger CI/CD to deploy application images"
          - "  5. Review container logs when alerts or dashboards look wrong"
          - ""
          - "MONITOR SERVERS: monitor-ai-01"
          - "WEB SERVERS: bank-web-01"
          - "CORE SERVERS: bank-core-01"
          - "=================================================="
          - ""
