groups:
  - name: moodle-availability
    interval: 15s
    rules:
      - alert: MoodleNodeExporterDown
        expr: up{job="moodle_node"} == 0
        for: 1m
        labels: {severity: critical, service: moodle, environment: staging, resource_id: moodle-app, runbook: moodle-node-exporter}
        annotations: {summary: Moodle node metrics unavailable}
      - alert: MoodleCAdvisorDown
        expr: up{job="moodle_cadvisor"} == 0
        for: 1m
        labels: {severity: warning, service: moodle, environment: staging, resource_id: moodle-app, runbook: moodle-cadvisor}
        annotations: {summary: Moodle container metrics unavailable}
      - alert: MoodlePublicProbeFailed
        expr: probe_success{job="blackbox_moodle_public"} == 0
        for: 30s
        labels: {severity: critical, service: moodle, environment: staging, resource_id: moodle-web-endpoint, runbook: moodle-public-probe}
        annotations: {summary: "Moodle public {{ $labels.probe }} probe failed"}
      - alert: MoodleRdsTcpProbeFailed
        expr: probe_success{job="blackbox_moodle_rds"} == 0
        for: 1m
        labels: {severity: critical, service: moodle-rds, environment: staging, resource_id: postgres-db, runbook: moodle-rds-probe}
        annotations: {summary: Moodle RDS TCP probe failed}
      - alert: MoodleEfsMountMissing
        expr: moodle_efs_mount_available{job="moodle_node"} == 0 or absent(moodle_efs_mount_available{job="moodle_node"})
        for: 1m
        labels: {severity: critical, service: moodle, environment: staging, resource_id: moodledata-volume, runbook: moodle-efs}
        annotations: {summary: Moodle EFS mount is not observed}

      # Alerts expose symptoms only. Scenario identity is held by the
      # restricted experiment controller, never exported as Prometheus data.
      - alert: MoodleSyntheticTransactionFailed
        expr: moodle_synthetic_success{job="moodle_synthetic",instance="monitor-ai-01"} == 0
        for: 5s
        labels: {severity: critical, service: moodle, environment: staging, resource_id: moodle-app, runbook: moodle-synthetic}
        annotations: {summary: Moodle synthetic transaction failed}
      - alert: MoodleSyntheticTransactionStale
        expr: time() - moodle_synthetic_last_run_timestamp_seconds{job="moodle_synthetic",instance="monitor-ai-01"} > 180
        for: 1m
        labels: {severity: warning, service: moodle, environment: staging, resource_id: moodle-app, runbook: moodle-synthetic}
        annotations: {summary: Moodle synthetic transaction has not run recently}
      - alert: MoodleNodeCpuHigh
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{job="moodle_node",mode="idle"}[30s]))) > 70
        for: 15s
        labels: {severity: warning, service: moodle, environment: staging, resource_id: moodle-app, runbook: moodle-cpu}
        annotations: {summary: "Moodle node CPU usage high on {{ $labels.instance }}"}
      - alert: MoodleWebContainerMissing
        expr: ((time() - max by (instance) (container_last_seen{job="moodle_cadvisor",name="release-moodle-web-1"}) > 30) and on(instance) (up{job="moodle_cadvisor"} == 1))
        for: 15s
        labels: {severity: critical, service: moodle, environment: staging, resource_id: moodle-app, runbook: moodle-container}
        annotations: {summary: "Moodle web container missing on {{ $labels.instance }}"}

      # These are real node-local symptoms, without a scenario_id label.
      # A fault marker and independent evidence must bind a specific scenario;
      # the alert alone cannot distinguish DB-03 from NET-02, for example.
      - alert: MoodleNodeRdsTcpFailed
        expr: |
          (moodle_node_rds_tcp_success{job="moodle_node"} == 0)
          and on(instance) (moodle_node_web_running{job="moodle_node"} == 1)
        for: 30s
        labels: {severity: critical, service: moodle, environment: staging, resource_id: moodle-app, runbook: moodle-node-rds-path}
        annotations: {summary: "Moodle web container on {{ $labels.instance }} cannot reach RDS TCP 5432"}
      - alert: MoodleNodeRdsTcpLatencyHigh
        expr: |
          (moodle_node_rds_tcp_duration_seconds{job="moodle_node"} > 0.2)
          and on(instance) (moodle_node_rds_tcp_success{job="moodle_node"} == 1)
        for: 30s
        labels: {severity: warning, service: moodle, environment: staging, resource_id: moodle-app, runbook: moodle-node-rds-path}
        annotations: {summary: "Moodle web container on {{ $labels.instance }} has high RDS TCP latency"}
      - alert: MoodleApacheRouterMissing
        expr: |
          (moodle_node_apache_router_enabled{job="moodle_node"} == 0)
          and on(instance) (moodle_node_web_running{job="moodle_node"} == 1)
        for: 15s
        labels: {severity: warning, service: moodle, environment: staging, resource_id: moodle-app, runbook: moodle-apache-router}
        annotations: {summary: "Moodle Apache router configuration is missing on {{ $labels.instance }}"}
      - alert: MoodleNodeRouterFallbackFailed
        expr: |
          (moodle_node_router_fallback_success{job="moodle_node"} == 0)
          and on(instance) (moodle_node_web_running{job="moodle_node"} == 1)
        for: 15s
        labels: {severity: warning, service: moodle, environment: staging, resource_id: moodle-app, runbook: moodle-router-fallback}
        annotations: {summary: "Moodle node-local router fallback failed on {{ $labels.instance }}"}
      - alert: MoodleTrustedProxyConfigDrift
        expr: |
          (moodle_node_reverse_proxy_enabled{job="moodle_node"} == 1)
          and on(instance) (moodle_node_web_running{job="moodle_node"} == 1)
        for: 15s
        labels: {severity: warning, service: moodle, environment: staging, resource_id: moodle-app, runbook: moodle-trusted-proxy}
        annotations: {summary: "Moodle reverse-proxy trust differs from the approved staging baseline on {{ $labels.instance }}"}
      - alert: MoodleScratchEnospc
        expr: moodle_node_scratch_enospc{job="moodle_node"} == 1
        for: 15s
        labels: {severity: warning, service: moodle, environment: staging, resource_id: moodle-app, runbook: moodle-isolated-scratch}
        annotations: {summary: "Isolated Moodle fault scratch filesystem is full on {{ $labels.instance }}"}
      - alert: MoodleNodeMemoryPressure
        expr: |
          -delta(node_memory_MemAvailable_bytes{job="moodle_node"}[1m]) > 33554432
        for: 15s
        labels: {severity: warning, service: moodle, environment: staging, resource_id: moodle-app, runbook: moodle-bounded-memory}
        annotations: {summary: "Moodle node available memory dropped by more than 32 MiB in one minute on {{ $labels.instance }}"}
      - alert: MoodleWebContainerRestarting
        expr: changes(moodle_node_web_restart_count{job="moodle_node"}[2m]) >= 2
        for: 15s
        labels: {severity: critical, service: moodle, environment: staging, resource_id: moodle-app, runbook: moodle-container-restart}
        annotations: {summary: "Moodle web container restarted repeatedly on {{ $labels.instance }}"}
      - alert: MoodleNodeProbeStale
        expr: time() - moodle_node_probe_timestamp_seconds{job="moodle_node"} > 120
        for: 1m
        labels: {severity: warning, service: moodle, environment: staging, resource_id: moodle-app, runbook: moodle-node-probes}
        annotations: {summary: "Moodle node-local probes have not refreshed on {{ $labels.instance }}"}
