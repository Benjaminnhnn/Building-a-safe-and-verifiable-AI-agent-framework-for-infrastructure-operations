# Lab mirror of the staging Prometheus config (ansible/playbooks/configure-moodle-monitoring.yml).
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/rules/moodle.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: moodle_node
    static_configs:
      - targets: ['probe-a:9101']
        labels: {instance: moodle-app-a}
      - targets: ['probe-b:9101']
        labels: {instance: moodle-app-b}
  - job_name: moodle_synthetic
    static_configs:
      - targets: ['synthetic:9102']
        labels: {instance: monitor-ai-01}
  - job_name: lb_targets
    metrics_path: /metrics
    static_configs:
      - targets: ['lb:8405']
        labels: {instance: alb-standin}
  - job_name: blackbox_moodle_public
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: ['http://moodle-lab:8080/healthz.php']
        labels: {service: moodle, probe: healthz}
      - targets: ['http://moodle-lab:8080/login/index.php']
        labels: {service: moodle, probe: login}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox:9115
      - source_labels: [__param_target]
        target_label: target
  - job_name: blackbox_moodle_rds
    metrics_path: /probe
    params: {module: [tcp_connect]}
    static_configs:
      - targets: ['moodle-db:5432']
        labels: {service: moodle-rds}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox:9115
      - source_labels: [__param_target]
        target_label: target
