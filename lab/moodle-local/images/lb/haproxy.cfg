# ALB stand-in: two targets with active HTTP health checks on /healthz.php.
global
  log stdout format raw local0
defaults
  mode http
  log global
  timeout connect 3s
  timeout client 30s
  timeout server 60s
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 2s
frontend public
  bind :8080
  default_backend moodle
frontend metrics
  bind :8405
  http-request use-service prometheus-exporter if { path /metrics }
backend moodle
  balance roundrobin
  option httpchk
  http-check send meth GET uri /healthz.php hdr Host moodle-lab:8080
  http-check expect status 200
  default-server check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
  server node-a moodle-web-a:8080
  server node-b moodle-web-b:8080
