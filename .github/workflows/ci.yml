name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches:
      - "feature/**"
      - develop
      - main

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent_src/requirements.txt
          pip install pytest ruff "httpx<0.28"

      - name: Lint (critical rules)
        run: |
          ruff check agent_src --select E9,F63,F7,F82

      - name: Test AI Agent (pytest)
        env:
          PYTHONPATH: agent_src
        run: pytest -q agent_src/tests

      - name: Build AI Agent image
        run: docker build -t local/ai-agent:ci-${{ github.sha }} agent_src

      - name: Build Moodle image
        run: docker build -t local/moodle:ci-${{ github.sha }} moodle

      - name: Validate Docker Compose files
        run: |
          cp release/.env.example release/.env.staging
          cp release/.env.example release/.env.production
          docker compose -f release/docker-compose.staging.yml config > /dev/null
          docker compose -f release/docker-compose.production.yml config > /dev/null
          MOODLE_RUNTIME_ENV_FILE=./moodle-runtime.env.example \
          docker compose --env-file release/moodle/moodle-runtime.env.example \
            -f release/moodle/docker-compose.yml config > /dev/null

      - name: Notify admins on failure
        if: failure()
        uses: actions/checkout@v4
        with:
          sparse-checkout: automation

      - name: Send Telegram notification
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x automation/notify.sh
          FAILED_STEP=$(echo "${{ job.status }}" | tr '[:upper:]' '[:lower:]')
          ./automation/notify.sh "CI Pipeline" "$FAILED_STEP" "Lint/Test/Build validation failed for ${{ github.ref_name }} by ${{ github.actor }}"

          
