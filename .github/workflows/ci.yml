name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches:
      - "feature/**"
      - develop
      - main

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Moodle Terraform contracts
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Validate and test mocked Terraform plans
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform fmt -check \
            terraform/rds.tf \
            terraform/storage-variables.tf \
            terraform/storage-outputs.tf \
            terraform/erpnext.tf \
            terraform/tests/storage.tftest.hcl \
            terraform/tests/erpnext.tftest.hcl
          terraform -chdir=terraform validate
          terraform -chdir=terraform test

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r agent_src/requirements.txt
          pip install pytest ruff "httpx<0.28"

      - name: Lint (critical rules)
        run: |
          ruff check agent_src --select E9,F63,F7,F82

      - name: Test AI Agent (pytest)
        env:
          PYTHONPATH: agent_src
        run: pytest -q agent_src/tests

      - name: Validate Moodle experiment and operator automation
        run: |
          python -m py_compile \
            automation/moodle-synthetic-transaction.py \
            automation/moodle-pipeline-replay.py \
            automation/aiops-unified-replay.py \
            automation/moodle-safe-executor-api.py \
            automation/moodle-safe-approval.py \
            automation/moodle-safe-gate-approval.py \
            automation/moodle-independent-verifier.py \
            automation/export-moodle-safe-action-audit.py \
            automation/moodle-safe-executor-request.py \
            automation/harvest-benchmark-results.py \
            automation/run-benchmark.py \
            automation/sprint6-acceptance.py \
            automation/sso-identity-drill.py \
            automation/benchmark-cost-dashboard.py \
            automation/erpnext-synthetic-transaction.py \
            evaluation/benchmark/statistical_analysis.py
          bash -n \
            automation/lib/moodle-fault-common.sh \
            automation/moodle-environment-baseline.sh \
            automation/moodle-fault-inject.sh \
            automation/moodle-fault-reset.sh \
            automation/moodle-fault-trial.sh \
            automation/moodle-synthetic-soak.sh \
            automation/moodle-sprint2-live-drill.sh \
            automation/github-deploy-moodle.sh \
            automation/configure-moodle-safe-executor-api.sh \
            automation/moodle-safe-executor-drill.sh \
            automation/moodle-scenario-verify.sh \
            automation/stage-moodle-release.sh \
            automation/moodle-db02-role-quota.sh \
            automation/prepare-moodle-runtime.sh \
            automation/moodle-preflight.sh \
            automation/configure-moodle-monitoring.sh \
            automation/configure-moodle-ghcr-access.sh \
            automation/configure-moodle-safe-executor.sh \
            automation/update-infrastructure.sh \
            automation/authorize-ai-engineer.sh \
            automation/capture-moodle-baseline.sh \
            automation/moodle-rds-restore-drill.sh \
            automation/erpnext-fault-inject.sh \
            automation/erpnext-fault-reset.sh
          if bash automation/moodle-scenario-verify.sh SEC-01 >/dev/null 2>&1; then
            echo "HUMAN_ONLY scenario was unexpectedly accepted for live verification" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 64
          fi

      - name: Replay merged unified AI control plane
        run: |
          report_dir="${RUNNER_TEMP}/aiops-unified-replay"
          python automation/aiops-unified-replay.py all --output-dir "$report_dir"
          python - "$report_dir/report.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              report = json.load(source)
          assert report["scenario_count"] == 15
          assert report["accepted_count"] == 15
          assert (
              report["verified_dry_run_count"]
              + report["safely_gated_count"]
              + report["safely_escalated_count"]
              == 15
          )
          assert report["failed_count"] == 0
          # Pinned per-scenario outcomes. The Safety Gate fails closed for any
          # catalogued mutation without a reciprocal rollback; a change here
          # (e.g. a new rollback entry or planner fix) must be reviewed.
          expected = {sid: "fail_closed_missing_rollback" for sid in (
              "CON-02", "CON-03", "DB-02", "DB-03", "NET-01", "NET-02",
              "NET-03", "RES-02", "RES-03", "SEC-02", "SEC-03")}
          # Their catalog actions have a verified reciprocal rollback (checked
          # independently by the replay), so the gate may allow a dry-run.
          expected["CON-01"] = "verified_dry_run"
          expected["RES-01"] = "verified_dry_run"
          expected["DB-01"] = "escalated_without_action"
          expected["SEC-01"] = "fail_closed_human_only"
          actual = {s["scenario_id"]: s["outcome"] for s in report["reports"]}
          assert actual == expected, actual
          assert report["fail_closed_denial_count"] == report["missing_reciprocal_rollback_count"] - report["human_only_count"]
          assert report["forbidden_live_execution_count"] == 0
          assert report["live_verification_executed"] is False
          assert report["recovery_claim_count"] == 0
          assert report["accepted_outcomes_are_not_recovery_results"] is True
          assert report["staging_live_allowlisted_scenario_count"] == 5
          assert report["offline_or_shadow_only_scenario_count"] == 10
          for scenario in report["reports"]:
              assert scenario["pipeline_mode"] == "offline_simulation"
              assert scenario["live_verification_executed"] is False
              assert scenario["recovery_claim_scope"] == "simulated_fixture_only"
              assert scenario["scenario_binding"]["execution_permitted_by_binding"] is False
          PY

      - name: Build AI Agent image
        run: docker build -f agent_src/Dockerfile -t local/ai-agent:ci-${{ github.sha }} .

      - name: Verify runtime image excludes evaluation ground truth
        run: |
          docker run --rm local/ai-agent:ci-${{ github.sha }} python -c \
            'import os; from pathlib import Path; from core.moodle.alert_integration import process_moodle_alert; assert not Path("/app/evaluation/ground_truth").exists(); os.environ["AIOPS_UNIFIED_CORE_MODE"]="live"; r=process_moodle_alert({"status":"firing","labels":{"service":"moodle","environment":"staging","alertname":"MoodleSyntheticTransactionFailed","scenario_id":"DB-01"}}); assert r["status"]=="escalated" and "ground-truth" in r["reason"] and r["execution_permitted"] is False; print("runtime fixture boundary and live fail-closed verified")'

      - name: Build Moodle image
        run: docker build -t local/moodle:ci-${{ github.sha }} moodle

      - name: Test Moodle secret-file handling
        run: |
          password_file="$(mktemp)"
          trap 'rm -f "$password_file"' EXIT
          printf '%s\n' 'moodle-test-password' > "$password_file"
          chmod 0644 "$password_file"
          docker run --rm \
            -e MOODLE_WWWROOT=http://moodle.test \
            -e MOODLE_DB_HOST=postgres.example.test \
            -e MOODLE_DB_PORT=5432 \
            -e MOODLE_DB_NAME=moodle \
            -e MOODLE_DB_USER=moodle_app \
            -e MOODLE_DATA_ROOT=/var/moodledata \
            -e MOODLE_DB_PASSWORD_FILE=/run/moodle-secrets/moodle-db-password \
            -e MOODLE_SSL_PROXY=false \
            -v "$password_file:/run/moodle-secrets/moodle-db-password:ro" \
            local/moodle:ci-${{ github.sha }} \
            sh -ec 'grep -F "\$CFG->dbpass = '\''moodle-test-password'\'';" /var/www/html/config.php'

      - name: Replay Moodle Sprint 2 pipeline
        env:
          PYTHONPATH: agent_src
        run: |
          replay_dir="$(mktemp -d)"
          python automation/moodle-pipeline-replay.py --output-dir "$replay_dir"
          python - "$replay_dir/report.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              report = json.load(source)
          assert report["scenario_count"] == 15
          assert report["forbidden_execution_count"] == 0
          for incident in report["reports"]:
              assert incident["state"] == "VERIFIED_DRY_RUN"
              assert incident["verification"]["resolution_eligible"] is False
          PY

      - name: Test Moodle public web root layout
        run: |
          docker run --rm --entrypoint /bin/sh local/moodle:ci-${{ github.sha }} \
            -c 'test -f /var/www/html/public/healthz.php && test -f /var/www/html/public/synthetic-transaction.php && php -l /var/www/html/public/synthetic-transaction.php && grep -Eq "^[[:space:]]*DocumentRoot /var/www/html/public$" /etc/apache2/sites-enabled/000-default.conf'

      - name: Validate Docker Compose files
        run: |
          MOODLE_RUNTIME_ENV_FILE=./moodle-runtime.env.example \
          docker compose --env-file release/moodle/moodle-runtime.env.example \
            -f release/moodle/docker-compose.yml config > /dev/null
          docker compose --env-file release/erpnext/.env.example \
            -f release/erpnext/docker-compose.yml config > /dev/null

      - name: Notify admins on failure
        if: failure()
        uses: actions/checkout@v7
        with:
          sparse-checkout: automation

      - name: Send Telegram notification
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x automation/notify.sh
          FAILED_STEP=$(echo "${{ job.status }}" | tr '[:upper:]' '[:lower:]')
          ./automation/notify.sh "CI Pipeline" "$FAILED_STEP" "Lint/Test/Build validation failed for ${{ github.ref_name }} by ${{ github.actor }}"

          
