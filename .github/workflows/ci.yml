name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches:
      - "feature/**"
      - develop
      - main

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent_src/requirements.txt
          pip install pytest ruff "httpx<0.28"

      - name: Lint (critical rules)
        run: |
          ruff check agent_src --select E9,F63,F7,F82

      - name: Test AI Agent (pytest)
        env:
          PYTHONPATH: agent_src
        run: pytest -q agent_src/tests

      - name: Build AI Agent image
        run: docker build -t local/ai-agent:ci-${{ github.sha }} agent_src

      - name: Build Moodle image
        run: docker build -t local/moodle:ci-${{ github.sha }} moodle

      - name: Test Moodle secret-file handling
        run: |
          password_file="$(mktemp)"
          trap 'rm -f "$password_file"' EXIT
          printf '%s\n' 'moodle-test-password' > "$password_file"
          chmod 0644 "$password_file"
          docker run --rm \
            -e MOODLE_WWWROOT=http://moodle.test \
            -e MOODLE_DB_HOST=postgres.example.test \
            -e MOODLE_DB_PORT=5432 \
            -e MOODLE_DB_NAME=moodle \
            -e MOODLE_DB_USER=moodle_app \
            -e MOODLE_DATA_ROOT=/var/moodledata \
            -e MOODLE_DB_PASSWORD_FILE=/run/moodle-secrets/moodle-db-password \
            -e MOODLE_SSL_PROXY=false \
            -v "$password_file:/run/moodle-secrets/moodle-db-password:ro" \
            local/moodle:ci-${{ github.sha }} \
            sh -ec 'grep -F "\$CFG->dbpass = '\''moodle-test-password'\'';" /var/www/html/config.php'

      - name: Test Moodle public web root layout
        run: |
          docker run --rm --entrypoint /bin/sh local/moodle:ci-${{ github.sha }} \
            -c 'test -f /var/www/html/public/healthz.php && grep -Eq "^[[:space:]]*DocumentRoot /var/www/html/public$" /etc/apache2/sites-enabled/000-default.conf'

      - name: Validate Docker Compose files
        run: |
          cp release/.env.example release/.env.staging
          cp release/.env.example release/.env.production
          docker compose -f release/docker-compose.staging.yml config > /dev/null
          docker compose -f release/docker-compose.production.yml config > /dev/null
          MOODLE_RUNTIME_ENV_FILE=./moodle-runtime.env.example \
          docker compose --env-file release/moodle/moodle-runtime.env.example \
            -f release/moodle/docker-compose.yml config > /dev/null

      - name: Notify admins on failure
        if: failure()
        uses: actions/checkout@v4
        with:
          sparse-checkout: automation

      - name: Send Telegram notification
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x automation/notify.sh
          FAILED_STEP=$(echo "${{ job.status }}" | tr '[:upper:]' '[:lower:]')
          ./automation/notify.sh "CI Pipeline" "$FAILED_STEP" "Lint/Test/Build validation failed for ${{ github.ref_name }} by ${{ github.actor }}"

          
