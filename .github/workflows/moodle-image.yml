name: Build Moodle image

on:
  push:
    branches:
      - "feature/**"
      - develop
      - main
    paths:
      - "moodle/**"
      - ".github/workflows/moodle-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable Moodle image
        uses: docker/build-push-action@v6
        with:
          context: ./moodle
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/moodle:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=moodle
          cache-to: type=gha,mode=max,scope=moodle
