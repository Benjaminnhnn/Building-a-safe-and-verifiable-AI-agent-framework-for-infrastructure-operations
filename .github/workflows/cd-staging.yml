name: CD Staging Moodle

on:
  push:
    branches: [develop]
    paths:
      - "moodle/**"
      - "release/moodle/**"
      - "automation/github-deploy-moodle.sh"
      - ".github/workflows/cd-staging.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: moodle-staging-deploy
  cancel-in-progress: false

jobs:
  build-moodle:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image reference
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/moodle:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Moodle image
        uses: docker/build-push-action@v6
        with:
          context: ./moodle
          push: true
          tags: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=moodle
          cache-to: type=gha,mode=max,scope=moodle

  deploy-moodle:
    runs-on: ubuntu-latest
    needs: build-moodle
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment configuration
        env:
          MOODLE_BASTION_HOST: ${{ secrets.MOODLE_BASTION_HOST }}
          MOODLE_APP_A_HOST: ${{ secrets.MOODLE_APP_A_HOST }}
          MOODLE_APP_B_HOST: ${{ secrets.MOODLE_APP_B_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          for variable in \
            MOODLE_BASTION_HOST MOODLE_APP_A_HOST MOODLE_APP_B_HOST \
            SSH_PRIVATE_KEY GHCR_USERNAME GHCR_TOKEN; do
            test -n "${!variable:-}" || {
              echo "Missing required staging secret: $variable" >&2
              exit 1
            }
          done

      - name: Roll out Moodle to both application nodes
        env:
          MOODLE_IMAGE: ${{ needs.build-moodle.outputs.image }}
          MOODLE_BASTION_HOST: ${{ secrets.MOODLE_BASTION_HOST }}
          MOODLE_APP_A_HOST: ${{ secrets.MOODLE_APP_A_HOST }}
          MOODLE_APP_B_HOST: ${{ secrets.MOODLE_APP_B_HOST }}
          MOODLE_PUBLIC_URL: ${{ secrets.MOODLE_PUBLIC_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: bash automation/github-deploy-moodle.sh
