global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: local-auth-lab
    evidence_class: runtime

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: openldap_ldaps
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: [openldap:636]
        labels:
          service: openldap
          resource_id: authlab-openldap
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox:9115
      - source_labels: [__param_target]
        target_label: instance
  - job_name: moodle
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://moodle-web:8080/healthz.php]
        labels:
          service: moodle
          resource_id: authlab-moodle
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox:9115
      - source_labels: [__param_target]
        target_label: instance
  - job_name: blackbox
    static_configs:
      - targets: [blackbox:9115]
  - job_name: auth_login
    metrics_path: /metrics
    static_configs:
      - targets: [auth-probe:9105]
        labels:
          service: moodle-auth
          resource_id: authlab-moodle-login
